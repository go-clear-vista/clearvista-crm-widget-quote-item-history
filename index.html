<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item History</title>

  <script src="https://live.zwidgets.com/js-sdk/1.5/ZohoEmbededAppSDK.min.js"></script>

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --border:#e7eaf0;
      --text:#0f172a;
      --muted:#64748b;
      --blue:#2f6fed;
      --blue2:#1f57cf;
      --green:#16a34a;
      --red:#dc2626;
      --shadow:0 10px 30px rgba(15,23,42,.08);
      --radius:14px;

      --yellow:#b45309;
      --yellow-bg:#fffbeb;
      --yellow-border:#fcd34d;

      --doc-quote-bg:#dbeafe;
      --doc-quote-dot:#3b82f6;
      --doc-order-bg:#e0e7ff;
      --doc-order-dot:#6366f1;
      --doc-invoice-bg:#dcfce7;
      --doc-invoice-dot:#22c55e;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      padding:18px;
      background:linear-gradient(180deg,#f6f8fb 0%,#f3f6fb 100%);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
    }

    .panel{
      max-width:1320px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      margin:0 auto;
    }

    .header{
      padding:18px 20px;
      border-bottom:1px solid var(--border);
    }

    .header h1{
      margin:0;
      font-size:16px;
      font-weight:750;
    }

    .header p{
      margin:6px 0 0;
      font-size:12.5px;
      color:var(--muted);
    }

    .content{
      padding:18px 20px;
    }

    .filters{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }

    @media (max-width:860px){
      .filters{grid-template-columns:1fr}
    }

    label,.flabel{
      display:block;
      font-size:12.5px;
      color:var(--muted);
      margin-bottom:6px;
      font-weight:650;
    }

    select{
      appearance:none;
      width:100%;
      height:42px;
      padding:0 40px 0 12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      font-size:14px;
      color:var(--text);
      outline:none;
      cursor:pointer;
    }

    select:focus{
      border-color:rgba(47,111,237,.7);
      box-shadow:0 0 0 3px rgba(47,111,237,.18);
    }

    select:disabled{
      background:#f8fafc;
      color:#64748b;
      cursor:default;
    }

    .select-wrap{position:relative}

    .chev{
      position:absolute;
      right:14px;
      top:50%;
      width:10px;
      height:10px;
      transform:translateY(-50%) rotate(45deg);
      border-right:2px solid #94a3b8;
      border-bottom:2px solid #94a3b8;
      pointer-events:none;
    }

    /* ---- multi-select checklist ---- */
    .ms{position:relative}

    .ms-btn{
      width:100%;
      height:42px;
      padding:0 40px 0 12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      font-size:14px;
      font-family:inherit;
      color:var(--text);
      text-align:left;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      outline:none;
    }

    .ms-btn:focus-visible{
      border-color:rgba(47,111,237,.7);
      box-shadow:0 0 0 3px rgba(47,111,237,.18);
    }

    .ms.open .ms-btn{
      border-color:rgba(47,111,237,.7);
      box-shadow:0 0 0 3px rgba(47,111,237,.18);
    }

    .ms-btn:disabled{
      background:#f8fafc;
      color:#64748b;
      cursor:default;
    }

    .ms-btn-text{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .ms-count{
      margin-left:auto;
      flex:0 0 auto;
      font-size:11.5px;
      font-weight:750;
      color:var(--blue);
      background:#eef4ff;
      border-radius:999px;
      padding:2px 8px;
    }

    .ms-panel{
      display:none;
      position:absolute;
      z-index:60;
      top:calc(100% + 6px);
      left:0;
      right:0;
      background:#fff;
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:0 18px 44px rgba(15,23,42,.16);
      overflow:hidden;
    }

    .ms.open .ms-panel{display:block}

    .ms-tools{
      display:flex;
      gap:8px;
      padding:10px 12px;
      border-bottom:1px solid var(--border);
      background:#fbfcfe;
    }

    .ms-link{
      border:1px solid var(--border);
      background:#fff;
      border-radius:8px;
      padding:4px 10px;
      font-size:11.5px;
      font-weight:700;
      font-family:inherit;
      color:var(--muted);
      cursor:pointer;
    }

    .ms-link:hover{
      color:var(--blue);
      border-color:rgba(47,111,237,.35);
    }

    .ms-list{
      max-height:240px;
      overflow-y:auto;
      padding:6px;
    }

    .ms-opt{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      border-radius:8px;
      font-size:13.5px;
      cursor:pointer;
      user-select:none;
    }

    .ms-opt:hover{background:#f6f8fb}

    .ms-opt input{
      width:15px;
      height:15px;
      accent-color:var(--blue);
      flex:0 0 auto;
      cursor:pointer;
      margin:0;
    }

    .ms-opt span{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .ms-empty{
      padding:12px 10px;
      font-size:12.5px;
      color:var(--muted);
    }

    /* ---- toolbar ---- */
    .toolbar{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:16px;
      flex-wrap:wrap;
    }

    .result-count{
      font-size:12.5px;
      color:var(--muted);
      font-weight:650;
    }

    .toolbar-spacer{margin-left:auto}

    .hint{
      font-size:11.5px;
      color:#9ca3af;
    }

    /* ---- table ---- */
    .table-wrap{
      margin-top:10px;
      border:1px solid var(--border);
      border-radius:12px;
      overflow:auto;
      max-height:420px;
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      font-size:12.5px;
    }

    thead th{
      position:sticky;
      top:0;
      z-index:2;
      background:#f8fafc;
      border-bottom:1px solid var(--border);
      padding:10px 9px;
      text-align:left;
      font-size:11.5px;
      font-weight:750;
      color:var(--muted);
      white-space:nowrap;
      cursor:pointer;
      user-select:none;
    }

    thead th:hover{color:var(--blue)}

    thead th .arrow{
      opacity:.35;
      font-size:9px;
      margin-left:4px;
    }

    thead th.sorted .arrow{opacity:1}
    thead th.sorted{color:var(--blue)}

    tbody td{
      padding:9px 9px;
      border-bottom:1px solid #f1f4f9;
      vertical-align:top;
    }

    tbody tr:last-child td{border-bottom:none}
    tbody tr:hover td{background:#fbfdff}

    .c-item{
      font-weight:700;
      white-space:nowrap;
    }

    .c-desc{
      min-width:150px;
      max-width:188px;
      color:var(--text);
      line-height:1.45;
    }

    .c-notes{
      min-width:80px;
      max-width:110px;
      color:var(--muted);
      line-height:1.45;
    }

    .c-date,.c-acct{white-space:nowrap}

    .c-acct{
      max-width:132px;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .c-num{
      text-align:right;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }

    .c-num.strong{font-weight:750}

    .pct{
      display:block;
      font-size:11px;
      color:var(--muted);
      font-weight:500;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:3px 10px;
      border-radius:999px;
      font-size:11.5px;
      font-weight:700;
      white-space:nowrap;
      background:#f1f5f9;
      color:#334155;
    }

    .pill .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      flex:0 0 auto;
      background:#64748b;
    }

    .doc-num{
      display:block;
      margin-top:4px;
      font-size:11px;
      color:var(--muted);
    }

    .empty{
      padding:36px 20px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }

    .empty strong{
      display:block;
      color:var(--text);
      font-size:14px;
      margin-bottom:4px;
    }

    /* ---- status + warning ---- */
    .status{
      display:none;
      margin-top:14px;
      font-size:13px;
      color:var(--muted);
      min-height:28px;
      padding:12px;
      border:1px dashed #e2e8f0;
      border-radius:12px;
      background:#fbfdff;
      align-items:center;
      gap:10px;
    }

    .status.show{display:flex}

    .status.error{
      color:var(--red);
      border-color:#fecaca;
      border-style:solid;
      background:#fef2f2;
    }

    .warn{
      display:none;
      margin-top:14px;
      font-size:12.5px;
      line-height:1.55;
      color:var(--yellow);
      background:var(--yellow-bg);
      border:1px solid var(--yellow-border);
      border-radius:12px;
      padding:11px 13px;
    }

    .warn.show{display:block}

    .spinner{
      width:16px;
      height:16px;
      border-radius:999px;
      border:2px solid rgba(47,111,237,.25);
      border-top-color:var(--blue);
      animation:spin .8s linear infinite;
      flex:0 0 auto;
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    /* ---- footer ---- */
    .footer{
      padding:14px 20px;
      border-top:1px solid var(--border);
      background:#fbfcfe;
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }

    .btn{
      height:38px;
      padding:0 18px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
      font-weight:750;
      font-size:13px;
      font-family:inherit;
      color:var(--text);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    .btn-primary{
      border-color:rgba(47,111,237,.35);
      background:linear-gradient(180deg,var(--blue) 0%,var(--blue2) 100%);
      color:#fff;
    }

    .btn:disabled{
      opacity:.7;
      cursor:default;
    }

    .reference-text{
      font-size:11px;
      color:#9ca3af;
      font-style:italic;
      text-align:center;
      padding:10px 0 0;
      margin-top:4px;
    }
  </style>
</head>

<body>

<div class="panel">
  <div class="header">
    <h1>Item History</h1>
    <p>Review past pricing for the items on this quote across sales quotes, sales orders and invoices.</p>
  </div>

  <div class="content">
    <div class="filters">

      <div>
        <span class="flabel">Item Name</span>
        <div class="ms" id="itemMs">
          <button class="ms-btn" type="button" id="itemMsBtn" disabled aria-expanded="false">
            <span class="ms-btn-text" id="itemMsText">Loading...</span>
            <span class="ms-count" id="itemMsCount" hidden></span>
            <span class="chev"></span>
          </button>
          <div class="ms-panel" id="itemMsPanel">
            <div class="ms-tools">
              <button class="ms-link" type="button" data-ms-all="itemMs">Select all</button>
              <button class="ms-link" type="button" data-ms-none="itemMs">Clear all</button>
            </div>
            <div class="ms-list" id="itemMsList"></div>
          </div>
        </div>
      </div>

      <div>
        <span class="flabel">Document Type</span>
        <div class="ms" id="docMs">
          <button class="ms-btn" type="button" id="docMsBtn" aria-expanded="false">
            <span class="ms-btn-text" id="docMsText">All document types</span>
            <span class="ms-count" id="docMsCount" hidden></span>
            <span class="chev"></span>
          </button>
          <div class="ms-panel" id="docMsPanel">
            <div class="ms-tools">
              <button class="ms-link" type="button" data-ms-all="docMs">Select all</button>
              <button class="ms-link" type="button" data-ms-none="docMs">Clear all</button>
            </div>
            <div class="ms-list" id="docMsList"></div>
          </div>
        </div>
      </div>

      <div>
        <label for="timeframe">Timeframe</label>
        <div class="select-wrap">
          <select id="timeframe">
            <option value="all" selected>All</option>
            <option value="3">Last 3 months</option>
            <option value="6">Last 6 months</option>
            <option value="12">Last 12 months</option>
          </select>
          <span class="chev"></span>
        </div>
      </div>

    </div>

    <div class="warn" id="warnBox"></div>

    <div class="toolbar">
      <span class="result-count" id="resultCount">—</span>
      <span class="toolbar-spacer"></span>
      <span class="hint">Item Price and Price After Discount are per unit.</span>
    </div>

    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr id="headRow"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="status" id="statusBox">
      <div class="spinner" id="statusSpinner"></div>
      <span id="statusText"></span>
    </div>
  </div>

  <div class="footer">
    <button class="btn btn-primary" type="button" id="closeBtn">Close</button>
  </div>

  <div class="reference-text" id="referenceText">Showing item history for Sales Quote Number: —</div>
</div>

<script>
"use strict";

var MODULE_API_NAME = "Quotes";
var FUNCTION_NAME   = "quote_item_history";

var DOC_TYPES = [
  { value: "Sales Quote",   label: "Sales Quote (CRM)" },
  { value: "Sales Order",   label: "Sales Order (Books)" },
  { value: "Sales Invoice", label: "Sales Invoice (Books)" }
];

var COLUMNS = [
  { key: "item_name",            label: "Item Name",            type: "text" },
  { key: "description",          label: "Description",          type: "text" },
  { key: "item_notes",           label: "Item Notes",           type: "text" },
  { key: "doc_type",             label: "Doc Type",             type: "text" },
  { key: "date",                 label: "Date",                 type: "text" },
  { key: "account_name",         label: "Account Name",         type: "text" },
  { key: "status",               label: "Stage / Status",       type: "text" },
  { key: "item_price",           label: "Item Price",           type: "num"  },
  { key: "discount",             label: "Discount",             type: "num"  },
  { key: "price_after_discount", label: "Price After Discount", type: "num"  }
];

var recordId    = null;
var quoteNumber = null;
var allRows     = [];
var sortKey     = "date";
var sortDir     = -1;

/* ------------------------------------------------------------------ *
 * Small helpers
 * ------------------------------------------------------------------ */

function el(id){ return document.getElementById(id); }

function esc(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function toNumber(value){
  if(value === null || value === undefined || value === "") return null;
  var n = typeof value === "number" ? value : parseFloat(String(value).replace(/[$,]/g,""));
  return isNaN(n) ? null : n;
}

function money(value){
  var n = toNumber(value);
  if(n === null) return "—";
  return n.toLocaleString(undefined,{ style:"currency", currency:"USD", minimumFractionDigits:2, maximumFractionDigits:2 });
}

function formatDate(value){
  if(!value) return "—";
  var m = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return String(value);
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return d.toLocaleDateString(undefined,{ year:"numeric", month:"short", day:"numeric" });
}

function setStatus(message, type){
  var box  = el("statusBox");
  var text = el("statusText");
  var spin = el("statusSpinner");

  box.className = "status";
  text.textContent = message || "";

  if(!message) return;

  box.classList.add("show");
  if(type === "error"){ box.classList.add("error"); spin.style.display = "none"; }
  else { spin.style.display = type === "loading" ? "block" : "none"; }
}

function setWarning(messages){
  var box = el("warnBox");
  var list = (messages || []).filter(function(m){ return !!m; });

  if(!list.length){
    box.className = "warn";
    box.innerHTML = "";
    return;
  }

  box.innerHTML = "<strong>Heads up:</strong> " + list.map(esc).join("<br>");
  box.className = "warn show";
}

/* ------------------------------------------------------------------ *
 * Colour maps (shared with the other ClearVista widgets)
 * ------------------------------------------------------------------ */

var STATUS_COLORS = {
  "draft":        { bg:"#dbeafe", dot:"#3b82f6" },
  "negotiation":  { bg:"#dcfce7", dot:"#22c55e" },
  "sent":         { bg:"#bfdbfe", dot:"#0ea5e9" },
  "on hold":      { bg:"#fef3c7", dot:"#f59e0b" },
  "quote ready":  { bg:"#dcfce7", dot:"#84cc16" },
  "closed won":   { bg:"#bbf7d0", dot:"#16a34a" },
  "closed lost":  { bg:"#fecaca", dot:"#ef4444" },
  "open":         { bg:"#bfdbfe", dot:"#0ea5e9" },
  "confirmed":    { bg:"#dcfce7", dot:"#84cc16" },
  "closed":       { bg:"#bbf7d0", dot:"#16a34a" },
  "paid":         { bg:"#bbf7d0", dot:"#16a34a" },
  "partially_paid":{ bg:"#fef3c7", dot:"#f59e0b" },
  "overdue":      { bg:"#fecaca", dot:"#ef4444" },
  "unpaid":       { bg:"#fef3c7", dot:"#f59e0b" },
  "void":         { bg:"#e2e8f0", dot:"#94a3b8" },
  "voided":       { bg:"#e2e8f0", dot:"#94a3b8" }
};

var DOC_COLORS = {
  "Sales Quote":   { bg:"var(--doc-quote-bg)",   dot:"var(--doc-quote-dot)" },
  "Sales Order":   { bg:"var(--doc-order-bg)",   dot:"var(--doc-order-dot)" },
  "Sales Invoice": { bg:"var(--doc-invoice-bg)", dot:"var(--doc-invoice-dot)" }
};

function titleCase(value){
  return String(value || "")
    .replace(/_/g," ")
    .replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function pill(text, colors){
  var style = colors ? ' style="background:' + colors.bg + '"' : "";
  var dot   = colors ? ' style="background:' + colors.dot + '"' : "";
  return '<span class="pill"' + style + '><span class="dot"' + dot + '></span>' + esc(text) + "</span>";
}

/* ------------------------------------------------------------------ *
 * Multi-select checklists
 * ------------------------------------------------------------------ */

function MultiSelect(id, allLabel, noneLabel, onChange){
  this.id        = id;
  this.allLabel  = allLabel;
  this.noneLabel = noneLabel;
  this.onChange  = onChange;
  this.options   = [];

  var self = this;
  var root = el(id);

  el(id + "Btn").addEventListener("click", function(){
    var willOpen = !root.classList.contains("open");
    closeAllMultiSelects();
    if(willOpen){
      root.classList.add("open");
      el(id + "Btn").setAttribute("aria-expanded","true");
    }
  });

  el(id + "List").addEventListener("change", function(event){
    if(event.target && event.target.type === "checkbox"){
      self.syncLabel();
      self.onChange();
    }
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-ms-all="' + id + '"]'), function(button){
    button.addEventListener("click", function(){ self.setAll(true); });
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-ms-none="' + id + '"]'), function(button){
    button.addEventListener("click", function(){ self.setAll(false); });
  });
}

MultiSelect.prototype.render = function(options){
  this.options = options || [];

  var list = el(this.id + "List");
  var self = this;

  if(!this.options.length){
    list.innerHTML = '<div class="ms-empty">No items on this quote.</div>';
    el(this.id + "Btn").disabled = true;
    this.syncLabel();
    return;
  }

  list.innerHTML = this.options.map(function(option, index){
    var inputId = self.id + "_opt_" + index;
    return '<label class="ms-opt" for="' + inputId + '">' +
             '<input type="checkbox" id="' + inputId + '" value="' + esc(option.value) + '" checked />' +
             "<span>" + esc(option.label) + "</span>" +
           "</label>";
  }).join("");

  el(this.id + "Btn").disabled = false;
  this.syncLabel();
};

MultiSelect.prototype.inputs = function(){
  return Array.prototype.slice.call(el(this.id + "List").querySelectorAll("input[type=checkbox]"));
};

MultiSelect.prototype.selected = function(){
  return this.inputs().filter(function(input){ return input.checked; }).map(function(input){ return input.value; });
};

MultiSelect.prototype.setAll = function(checked){
  this.inputs().forEach(function(input){ input.checked = checked; });
  this.syncLabel();
  this.onChange();
};

MultiSelect.prototype.syncLabel = function(){
  var inputs   = this.inputs();
  var selected = this.selected();
  var text     = el(this.id + "Text");
  var count    = el(this.id + "Count");

  if(!inputs.length){
    text.textContent = this.noneLabel;
    count.hidden = true;
    return;
  }

  if(!selected.length){
    text.textContent = "None selected";
  } else if(selected.length === inputs.length){
    text.textContent = this.allLabel;
  } else if(selected.length === 1){
    var only = inputs.filter(function(input){ return input.checked; })[0];
    text.textContent = only.parentNode.querySelector("span").textContent;
  } else {
    text.textContent = selected.length + " selected";
  }

  count.hidden = false;
  count.textContent = selected.length + "/" + inputs.length;
};

function closeAllMultiSelects(){
  Array.prototype.forEach.call(document.querySelectorAll(".ms"), function(root){
    root.classList.remove("open");
    var button = root.querySelector(".ms-btn");
    if(button) button.setAttribute("aria-expanded","false");
  });
}

document.addEventListener("click", function(event){
  if(!event.target.closest || !event.target.closest(".ms")) closeAllMultiSelects();
});

document.addEventListener("keydown", function(event){
  if(event.key === "Escape") closeAllMultiSelects();
});

var itemFilter = new MultiSelect("itemMs", "All items", "No items", render);
var docFilter  = new MultiSelect("docMs",  "All document types", "No document types", render);

/* ------------------------------------------------------------------ *
 * Table rendering
 * ------------------------------------------------------------------ */

function renderHead(){
  el("headRow").innerHTML = COLUMNS.map(function(column){
    var isSorted = column.key === sortKey;
    var arrow    = isSorted ? (sortDir === 1 ? "▲" : "▼") : "▲";
    return '<th class="' + (isSorted ? "sorted " : "") + (column.type === "num" ? "c-num" : "") +
           '" data-key="' + column.key + '">' + esc(column.label) +
           '<span class="arrow">' + arrow + "</span></th>";
  }).join("");

  Array.prototype.forEach.call(el("headRow").querySelectorAll("th"), function(th){
    th.addEventListener("click", function(){
      var key = th.getAttribute("data-key");
      if(key === sortKey){ sortDir = -sortDir; }
      else { sortKey = key; sortDir = (key === "date") ? -1 : 1; }
      render();
    });
  });
}

function cutoffDate(months){
  if(months === "all") return null;
  var d = new Date();
  d.setMonth(d.getMonth() - Number(months));
  return d.getFullYear() + "-" +
         String(d.getMonth() + 1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}

function visibleRows(){
  var items    = itemFilter.selected();
  var docs     = docFilter.selected();
  var cutoff   = cutoffDate(el("timeframe").value);
  var itemSet  = {};
  var docSet   = {};

  items.forEach(function(value){ itemSet[value] = true; });
  docs.forEach(function(value){ docSet[value] = true; });

  var rows = allRows.filter(function(row){
    if(!itemSet[row.item_name]) return false;
    if(!docSet[row.doc_type])   return false;
    if(cutoff && (!row.date || String(row.date) < cutoff)) return false;
    return true;
  });

  var column = COLUMNS.filter(function(c){ return c.key === sortKey; })[0] || COLUMNS[4];

  rows.sort(function(a, b){
    var av, bv;

    if(column.type === "num"){
      av = toNumber(a[sortKey]);
      bv = toNumber(b[sortKey]);
      if(av === null && bv === null) return 0;
      if(av === null) return 1;
      if(bv === null) return -1;
      return (av - bv) * sortDir;
    }

    av = String(a[sortKey] === null || a[sortKey] === undefined ? "" : a[sortKey]).toLowerCase();
    bv = String(b[sortKey] === null || b[sortKey] === undefined ? "" : b[sortKey]).toLowerCase();
    if(av === bv) return 0;
    return (av < bv ? -1 : 1) * sortDir;
  });

  return rows;
}

function discountCell(row){
  var amount  = toNumber(row.discount);
  var gross   = toNumber(row.line_total);
  var percent = null;

  if(amount !== null && gross !== null && gross !== 0){
    percent = (amount / gross) * 100;
  } else if(row.discount_percent !== null && row.discount_percent !== undefined){
    percent = toNumber(row.discount_percent);
  }

  if(amount === null && percent === null) return "—";

  var html = amount === null ? "—" : money(amount);
  if(percent !== null && isFinite(percent)){
    html += '<span class="pct">' + percent.toFixed(1) + "%</span>";
  }
  return html;
}

function renderBody(rows){
  var body = el("tableBody");

  if(!rows.length){
    var message = allRows.length
      ? "<strong>No matching history</strong>Try widening the timeframe or selecting more items and document types."
      : "<strong>No item history found</strong>None of the items on this quote appear on any other quote, sales order or invoice yet.";
    body.innerHTML = '<tr><td class="empty" colspan="' + COLUMNS.length + '">' + message + "</td></tr>";
    return;
  }

  body.innerHTML = rows.map(function(row){
    var status     = row.status ? titleCase(row.status) : "—";
    var statusKey  = String(row.status || "").toLowerCase().trim();
    var docColors  = DOC_COLORS[row.doc_type] || null;
    var docNumber  = row.doc_number ? '<span class="doc-num">' + esc(row.doc_number) + "</span>" : "";
    var unitAfter  = row.price_after_discount;

    return "<tr>" +
      '<td class="c-item">'  + esc(row.item_name || "—") + "</td>" +
      '<td class="c-desc">'  + (row.description ? esc(row.description) : "—") + "</td>" +
      '<td class="c-notes">' + (row.item_notes  ? esc(row.item_notes)  : "—") + "</td>" +
      "<td>" + pill(row.doc_type || "—", docColors) + docNumber + "</td>" +
      '<td class="c-date">'  + formatDate(row.date) + "</td>" +
      '<td class="c-acct" title="' + esc(row.account_name || "") + '">' + (row.account_name ? esc(row.account_name) : "—") + "</td>" +
      "<td>" + pill(status, STATUS_COLORS[statusKey] || null) + "</td>" +
      '<td class="c-num">' + money(row.item_price) + "</td>" +
      '<td class="c-num">' + discountCell(row) + "</td>" +
      '<td class="c-num strong">' + money(unitAfter) + "</td>" +
    "</tr>";
  }).join("");
}

function render(){
  renderHead();

  var rows = visibleRows();
  renderBody(rows);

  var total = allRows.length;
  el("resultCount").textContent = total
    ? "Showing " + rows.length + " of " + total + " line " + (total === 1 ? "item" : "items")
    : "No history loaded";
}

/* ------------------------------------------------------------------ *
 * Backend call
 * ------------------------------------------------------------------ */

function parseFunctionResult(response){
  if(!response) return null;
  if(response.details && response.details.output) return response.details.output;
  if(response.data) return response.data;
  return response;
}

function safeJsonParse(value){
  if(value === null || value === undefined) return null;
  if(typeof value === "object") return value;
  if(typeof value !== "string") return value;
  try { return JSON.parse(value); }
  catch(error){ return value; }
}

function executeFunction(name, args){
  return ZOHO.CRM.FUNCTIONS.execute(name, { arguments: JSON.stringify(args) })
    .then(function(response){ return safeJsonParse(parseFunctionResult(response)); });
}

function normalizeRows(rows){
  return (rows || []).map(function(row){
    var quantity   = toNumber(row.quantity);
    var afterTotal = toNumber(row.total_after_discount);
    var unitAfter  = toNumber(row.price_after_discount);

    // Prefer an explicit per-unit value; otherwise derive it from the
    // discounted extended total, per the ClearVista costing convention.
    if(unitAfter === null && afterTotal !== null && quantity){
      unitAfter = afterTotal / quantity;
    }

    return {
      item_name:            row.item_name || "",
      description:          row.description || "",
      item_notes:           row.item_notes || "",
      doc_type:             row.doc_type || "",
      doc_number:           row.doc_number || "",
      date:                 row.date || "",
      account_name:         row.account_name || "",
      status:               row.status || "",
      item_price:           toNumber(row.item_price),
      discount:             toNumber(row.discount),
      discount_percent:     toNumber(row.discount_percent),
      line_total:           toNumber(row.line_total),
      quantity:             quantity,
      price_after_discount: unitAfter
    };
  });
}

function applyPayload(payload){
  allRows = normalizeRows(payload.rows);

  var itemNames = payload.items && payload.items.length
    ? payload.items.slice()
    : allRows.map(function(row){ return row.item_name; });

  var unique = [];
  var seen   = {};
  itemNames.forEach(function(name){
    if(name && !seen[name]){ seen[name] = true; unique.push(name); }
  });
  unique.sort();

  itemFilter.render(unique.map(function(name){ return { value:name, label:name }; }));
  docFilter.render(DOC_TYPES);

  setWarning(payload.warnings);
  render();
}

function setReference(number){
  quoteNumber = number || "—";
  el("referenceText").textContent = "Showing item history for Sales Quote Number: " + quoteNumber;
}

/* ------------------------------------------------------------------ *
 * Init
 * ------------------------------------------------------------------ */

el("timeframe").addEventListener("change", render);

el("closeBtn").addEventListener("click", function(){
  try { ZOHO.CRM.UI.Popup.close(); }
  catch(error){ try { window.close(); } catch(ignored){} }
});

renderHead();
renderBody([]);

var initialised = false;
var sdkReady = (typeof ZOHO !== "undefined") && !!(ZOHO.embeddedApp);

async function onPageLoad(data){
  initialised = true;
  recordId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;

  setStatus("Loading item history...", "loading");

  try {
    if(!recordId) throw new Error("No quote record ID was supplied by CRM.");

    var response = await ZOHO.CRM.API.getRecord({ Entity: MODULE_API_NAME, RecordID: recordId });
    var record   = response && response.data && response.data[0] ? response.data[0] : null;
    if(!record) throw new Error("Quote record not found.");

    setReference(record.CRM_Quote_Number || record.Quote_Number || record.Quote_No || record.Subject || recordId);

    var payload = await executeFunction(FUNCTION_NAME, { quote_id: String(recordId) });

    if(!payload || typeof payload !== "object"){
      throw new Error("The " + FUNCTION_NAME + " function returned no data.");
    }

    if(payload.success !== true){
      throw new Error(payload.message || "The " + FUNCTION_NAME + " function reported a failure.");
    }

    if(payload.quote && payload.quote.quote_number) setReference(payload.quote.quote_number);

    applyPayload(payload);
    setStatus("", "");

  } catch(error){
    console.error(error);
    itemFilter.render([]);
    docFilter.render(DOC_TYPES);
    render();
    setStatus(error && error.message ? error.message : "Unable to load item history.", "error");
  }
}

if(sdkReady){
  ZOHO.embeddedApp.on("PageLoad", onPageLoad);
  ZOHO.embeddedApp.init();
  setTimeout(function(){
    showPreview("Preview mode - this page is not running inside Zoho CRM, so the data below is sample data.");
  }, 2500);
} else {
  // The Zoho Embedded App SDK could not be loaded (opened outside CRM, or the
  // CDN is unreachable). Render the preview rather than a blank page.
  showPreview("The Zoho CRM Embedded App SDK could not be loaded, so the data below is sample data.");
}
